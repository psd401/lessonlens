name: Security Scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-security-scan.yml@44b7d6ee7550f937305bd21744e111a2f7333dd4 # v1.9.0
    with:
      runner: ${{ vars.PSD_LINUX_RUNNER || 'github' }}
