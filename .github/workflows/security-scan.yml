  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-security-scan.yml@406c3d2a3881c95086e2b92981b95992e78344d8 # v1.21.0
    with:
      runner: ${{ vars.PSD_LINUX_RUNNER || 'github' }}
