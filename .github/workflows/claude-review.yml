name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # reusable's claude-code-action OIDC exchange; caller must grant (org default is read-only)
    # Dependabot-triggered runs cannot grant the called workflow's
    # `id-token: write` permission, which fails the run at startup before the
    # reusable workflow's own Dependabot guard can evaluate. Skip the call.
    if: github.actor != 'dependabot[bot]'
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@main
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
  # Dependabot PRs aren't reviewed, but production repos require a
  # `claude-review / claude-review` check, and the skipped job above reports
  # only `claude-review`. This job has the same name and calls a no-op
  # reusable, so the required context passes (PSD401/.github#27).
  claude-review-dependabot:
    name: claude-review
    permissions: {}
    if: github.actor == 'dependabot[bot]'
    uses: PSD401/.github/.github/workflows/reusable-claude-review-skip.yml@main # zizmor: ignore[unpinned-uses]
