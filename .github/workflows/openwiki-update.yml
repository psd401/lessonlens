name: OpenWiki Update
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

# Several merges in a row would otherwise queue a full wiki regeneration each;
# only the last one's output survives anyway.
concurrency:
  group: openwiki
  cancel-in-progress: true

jobs:
  openwiki:
    permissions:
      contents: write # caller must grant; org default token is read-only
      pull-requests: write
    uses: PSD401/.github/.github/workflows/reusable-openwiki.yml@9b1afe0d9fc34cb6f5427179854ebf7852a1c748 # v1.2.1
    with:
      base_branch: main
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      PSD_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.PSD_AUTOMATION_APP_PRIVATE_KEY }}
