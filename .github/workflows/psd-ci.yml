name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The caller job is named `psd-ci` so the combined gate in psd-ci-jobs.yml
# reports as `psd-ci / psd-ci`, the context the org rulesets require
# (psd-dev-standards standards/06 §2).
jobs:
  psd-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/psd-ci-jobs.yml
    secrets: inherit
