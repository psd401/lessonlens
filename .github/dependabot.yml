version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The backend uses bun; Dependabot's npm ecosystem reads bun.lock.
  - package-ecosystem: npm
    directory: /CloudRunBackend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
